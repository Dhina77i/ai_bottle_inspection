services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AI Water Bottle Inspection
      DATABASE_URL: sqlite:///./database/inspections.db
      YOLO_WEIGHTS: weights/best.pt
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CONFIDENCE_THRESHOLD: "0.35"
      FRAME_STRIDE: "12"
      YOLO_IMGSZ: "640"
      MAX_VIDEO_FRAMES: "0"
    volumes:
      - ./backend/database:/app/database
      - ./backend/uploads:/app/uploads
      - ./backend/processed:/app/processed
      - ./backend/reports:/app/reports
      - ./backend/weights:/app/weights

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws/live
    depends_on:
      - backend
